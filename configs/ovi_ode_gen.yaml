
ckpt_dir: /cpfs01/gongshukai/weights/Ovi
output_dir: /cpfs01/gongshukai/step_distillation/data/ode_pairs_1219
sample_steps: 48
solver_name: unipc
model_name: "720x720_5s" # ["720x720_5s", "960x960_5s", "960x960_10s"]
shift: 5.0
sp_size: 1
audio_guidance_scale: 3.0
video_guidance_scale: 4.0

# FILE: configs/inference/ovi.yaml (REVISED)

model_name: Ovi

# --- 选择推理模式 ---
# 1. 用于原始Ovi模型: 指定 inference_steps, Use UniPC for sampling
# inference_steps: 50
# 2. 用于蒸馏后的Ovi模型: 注释掉 inference_steps，并使用下面的 denoising_step_list
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true # 当使用 denoising_step_list 时设为 true

# --- CFG 和采样器参数 ---
timestep_shift: 5.0
video_guidance_scale: 4.0   # <-- 新增
audio_guidance_scale: 3.0   # <-- 新增
video_negative_prompt: "jitter, bad hands, blur, distortion, watermark, text, low quality" # <-- 新增
audio_negative_prompt: "robotic, muffled, echo, distorted, noise, low quality" # <-- 新增

# --- 其他参数 (保持不变) ---
video_h: 704
video_w: 1280
video_num_frames: 121
audio_duration_secs: 5
audio_sample_rate: 16000
output_dir: outputs/ovi_inference
model_kwargs:
  video_config_path: "ovi/configs/model/dit/video.json"
  audio_config_path: "ovi/configs/model/dit/audio.json"
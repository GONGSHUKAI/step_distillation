## Model settings
model_name: Ovi
generator_name: Ovi
generator_type: causal
generator_path: /cpfs01/gongshukai/weights/Ovi/Ovi/model.safetensors

## ODE pretraining settings
distribution_loss: ode
trainer: ovi_ode # <--- 新增的 Trainer 类型
denoising_step_list: [1000, 750, 500, 250]
timestep_shift: 5.0
model_kwargs:
  video_config_path: "ovi/configs/model/dit/video.json"
  audio_config_path: "ovi/configs/model/dit/audio.json"
  timestep_shift: 5.0
no_visualize: true
load_raw_video: false
seed: 0

## Training settings
gradient_checkpointing: true
mixed_precision: true  # 使用 bf16
warp_denoising_step: true
batch_size: 4
max_pair: 10000000
lr: 2.0e-06
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
gradient_accumulation_steps: 4

## checkpointing
log_iters: 5000
checkpoints_to_keep: [5000, ]
num_keep_checkpoints: 2

## Dataset settings
data_path: /cpfs01/gongshukai/step_distillation/data/ode_pairs_1219   # ls /cpfs01/gongshukai/step_distillation/data/ode_pairs_1219 | wc -l
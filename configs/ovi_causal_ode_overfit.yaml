## Model settings
model_name: Ovi
generator_name: Ovi
generator_type: causal
generator_path: /cpfs01/gongshukai/weights/Ovi/Ovi/model.safetensors

## ODE pretraining settings
distribution_loss: ode
trainer: ovi_ode
denoising_step_list: [1000, 750, 500, 250]
timestep_shift: 5.0
model_kwargs:
  video_config_path: "ovi/configs/model/dit/video.json"
  audio_config_path: "ovi/configs/model/dit/audio.json"
  timestep_shift: 5.0
no_visualize: true
load_raw_video: false
seed: 0
video_latent_shape: [32, 48, 44, 80]
audio_latent_shape: [160, 20]

## Training settings
gradient_checkpointing: true
mixed_precision: true
warp_denoising_step: true
batch_size: 4
max_pair: 10000000
lr: 1.0e-5
beta1: 0.9
beta2: 0.999
weight_decay: 0.01
gradient_accumulation_steps: 1
eval_csv: /cpfs01/gongshukai/step_distillation/examples/ode_example.csv

## checkpointing
log_iters: 1500
checkpoints_to_keep: [5000, ]
num_keep_checkpoints: 2
video_log_iters: 300


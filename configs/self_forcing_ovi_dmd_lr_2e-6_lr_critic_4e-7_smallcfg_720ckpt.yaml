# FSDP related settings
generator_fsdp_wrap_strategy: transformer
real_score_fsdp_wrap_strategy: transformer
fake_score_fsdp_wrap_strategy: transformer
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: full

# Logging
wandb_host: https://api.wandb.ai
wandb_key: afa4e78959b05201e369f448504697737237fc5c
wandb_entity: shukai_gong
wandb_project: Ovi-distill

# Model settings
real_name: Ovi                  # teacher model, frozen
fake_name: Ovi                  # critic model, trainable
generator_name: Ovi             # student model, trainable
generator_type: bidirectional   # bidirectional diffusion, not causal diffusion
real_path: /cpfs01/gongshukai/weights/Ovi/Ovi/model.safetensors
fake_path: /cpfs01/gongshukai/weights/Ovi/Ovi/model.safetensors
generator_path: /cpfs01/gongshukai/weights/Ovi/Ovi/model.safetensors

## Distillation settings
distribution_loss: dmd            
trainer: score_distillation_ovi   
num_frame_per_block: 31
num_training_frames: 31
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0
initial_step: 0
dfake_gen_update_ratio: 5

## Diffusion settings
denoising_step_list: [1000, 750, 500, 250]
num_train_timestep: 1000
timestep_shift: 5.0
video_guidance_scale: 2.0 # ADDED: Specific guidance for video teacher
audio_guidance_scale: 1.5 # ADDED: Specific guidance for audio teacher
denoising_loss_type: x0
video_negative_prompt: "jitter, bad hands, blur, distortion"  # Artifacts to avoid in video
audio_negative_prompt: "robotic, muffled, echo, distorted"    # Artifacts to avoid in audio

## Training settings
text_encoder_cpu_offload: true
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true, 将离散步数映射到连续时间步
ts_schedule: false
gradient_checkpointing: true
mixed_precision: true
seed: 0
lr: 2.0e-06             # orginal lr: 5e-7
lr_critic: 4.0e-07      # orginal lr_critic: 1e-7
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
batch_size: 2
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 1000
video_latent_shape: [1, 31, 48, 44, 80]   # in TI2AV settings, H, W depends on ref image size
audio_latent_shape: [1, 157, 20]  # 5s * 16kHz / 512 = 156.25

## Dataset settings
num_frames: 121
h: 704
w: 1280
audio_sample_rate: 16000
audio_duration_secs: 5